
[project]
name = "fft-voice-classifier"
version = "0.1.0"
description = "Identify voices using FFT and machine learning"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "joblib>=1.3",
    "matplotlib>=3.11.2",
]
